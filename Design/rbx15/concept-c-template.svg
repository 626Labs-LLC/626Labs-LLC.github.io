<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- RBX15 concept C — the true unwrap. Torso panel geometry lifted 1:1 from the app's
       SHIRT_REGIONS (585×559 template, scaled 0.5): up/right/front/left/back/down. -->
  <rect width="256" height="256" rx="52" fill="#0f1f31"/>
  <!-- up flap -->
  <rect x="64.5" y="64.5" width="61" height="29" rx="2" fill="#f22f89"/>
  <!-- right side -->
  <rect x="31.5" y="97.5" width="29" height="61" rx="2" fill="#0f89b4"/>
  <!-- front: the hero panel -->
  <rect x="64.5" y="97.5" width="61" height="61" rx="2" fill="#17d4fa"/>
  <!-- left side -->
  <rect x="129.5" y="97.5" width="29" height="61" rx="2" fill="#0f89b4"/>
  <!-- back -->
  <rect x="162.5" y="97.5" width="61" height="61" rx="2" fill="#41628c"/>
  <!-- down flap -->
  <rect x="64.5" y="162.5" width="61" height="29" rx="2" fill="#f22f89"/>
  <!-- the selection on front: this is where your art goes -->
  <rect x="75" y="108" width="40" height="40" rx="1" fill="none" stroke="#eef7ff" stroke-width="3.5" stroke-dasharray="8 7" opacity="0.9"/>
</svg>
