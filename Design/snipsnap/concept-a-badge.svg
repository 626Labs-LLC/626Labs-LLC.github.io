    <mask id="taghole">
      <rect x="152" y="170" width="92" height="54" rx="13" fill="white"/>
      <circle cx="170" cy="197" r="9" fill="black"/>
    </mask>
  </defs>
  <rect x="42" y="42" width="128" height="128" rx="8" fill="none" stroke="#ffffff" stroke-width="14" stroke-dasharray="24 15" stroke-linecap="round"/>
  <g transform="rotate(-20 196 196)">
    <rect x="152" y="170" width="92" height="54" rx="13" fill="#ffffff" mask="url(#taghole)"/>
  </g>
</svg>
