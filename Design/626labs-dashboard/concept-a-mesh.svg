<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Dashboard concept A — the agent mesh. Evolution of the shipped in-editor mark:
       hexagon container, hub-and-spoke agent constellation in the duo + dashboard teal. -->
  <defs>
    <linearGradient id="rim" x1="60" y1="60" x2="196" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17d4fa"/><stop offset="1" stop-color="#f22f89"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="#0f1f31"/>
  <polygon points="128,50 195.5,89 195.5,167 128,206 60.5,167 60.5,89"
           fill="none" stroke="url(#rim)" stroke-width="9" stroke-linejoin="round"/>
  <!-- spokes: hub to agents -->
  <g stroke="#eef7ff" stroke-width="5" opacity="0.5" stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="86"/>
    <line x1="128" y1="128" x2="91" y2="151"/>
    <line x1="128" y1="128" x2="165" y2="151"/>
  </g>
  <!-- agents -->
  <circle cx="128" cy="78" r="12" fill="#f22f89"/>
  <circle cx="85" cy="155" r="12" fill="#2ee6c9"/>
  <circle cx="171" cy="155" r="12" fill="#17d4fa"/>
  <!-- hub: the OS -->
  <circle cx="128" cy="128" r="15" fill="#eef7ff"/>
  <circle cx="128" cy="128" r="7" fill="#0f1f31"/>
</svg>
