<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Dashboard concept C — the mission deck. The dashboard as itself: a card grid
       with the duo carrying the hero tiles and teal marking live status. -->
  <rect width="256" height="256" rx="52" fill="#0f1f31"/>
  <rect x="56" y="56" width="88" height="58" rx="10" fill="#17d4fa"/>
  <rect x="152" y="56" width="48" height="58" rx="10" fill="#1b3a58"/>
  <rect x="56" y="122" width="48" height="78" rx="10" fill="#1b3a58"/>
  <rect x="112" y="122" width="88" height="78" rx="10" fill="#f22f89"/>
  <!-- live status on the muted cards -->
  <circle cx="176" cy="76" r="6" fill="#2ee6c9"/>
  <rect x="66" y="140" width="28" height="6" rx="3" fill="#2ee6c9" opacity="0.9"/>
  <rect x="66" y="156" width="28" height="6" rx="3" fill="#eef7ff" opacity="0.35"/>
  <rect x="66" y="172" width="28" height="6" rx="3" fill="#eef7ff" opacity="0.35"/>
</svg>
