<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — 626 Labs</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="That page isn't here. Head back to 626 Labs." />
  <link rel="icon" type="image/png" href="/favicon-626.png" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/SpaceGrotesk-Variable.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter-Variable.woff2" crossorigin />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <!-- Base tokens (--bg-0, --text, --cyan, --brand-gradient ...) come from
       the active theme's tokens.css. This zone is renderer-owned:
       scripts/render-hub.py rewrites it from content/themes.json on every
       run, so the page follows the rotation. Never edit the link by hand. -->
  <!-- SITE_JSON:theme-css:start -->
<link rel="stylesheet" href="/themes/phosphor-blueprint/tokens.css">
  <!-- SITE_JSON:theme-css:end -->
  <style>
    /* This page defines no token of its own. Its palette is the theme's
       base vocabulary (archetypes.REQUIRED_TOKENS), linked above; the
       layout below is the page's. One literal is kept where no token
       carries its value — named at the rule that spends it. */
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background:
        radial-gradient(60% 50% at 30% 20%, rgba(23,212,250,.16) 0%, transparent 60%),
        radial-gradient(45% 45% at 78% 70%, rgba(242,47,137,.13) 0%, transparent 60%),
        var(--bg-0);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      line-height: 1.55;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 560px; text-align: center; }
    .eyebrow {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em;
      /* Contract ink, not the old #6a849e literal: that value was 4.29:1 on
         Phosphor Blueprint's navy and 2.58:1 on slate, so the first
         rotation would have shipped a sub-AA eyebrow. --fg-3 is 7.43:1 on
         navy and 5.55:1 on slate, and the next theme carries its own. */
      color: var(--fg-3); margin-bottom: 20px;
    }
    .code {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700; line-height: 1;
      font-size: clamp(96px, 20vw, 200px);
      letter-spacing: -0.04em;
      background: var(--brand-gradient);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      margin: 0;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600; font-size: clamp(24px, 3.5vw, 34px);
      letter-spacing: -0.02em; margin: 8px 0 16px;
    }
    p { color: var(--text-sec); font-size: 17px; margin: 0 auto 32px; max-width: 460px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 10px;
      font-weight: 600; font-size: 15px; text-decoration: none;
      transition: all 140ms cubic-bezier(.2,.7,.2,1);
    }
    .btn-primary { background: var(--brand-gradient); color: var(--ink-950); }
    .btn-primary:hover { filter: brightness(1.08); box-shadow: 0 0 24px rgba(23,212,250,.35); }
    .btn-ghost { color: var(--text); border: 1px solid rgba(255,255,255,.16); }
    .btn-ghost:hover { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.32); }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; }
    }
  
    /* ============================================================
       Phosphor Blueprint treatment — the same alias pattern the bespoke
       product pages carry (conundrum.html, rororo.html, etsy-mcp.html).

       Each alias reads the theme's treatment name and falls back to the
       contracted token behind it. Under phosphor-blueprint every one
       resolves to the --pb-* value the linked tokens.css defines, exactly
       as when this page defined them itself. Under a theme that satisfies
       archetypes.REQUIRED_TOKENS and ships no treatment, the field falls
       through to --bg-0 and the grid, the scanlines and the bloom
       disappear, so the page rotates instead of staying a private copy of
       one month's dress.

       No contracted token is redefined here. A page that overrides --bg-0
       is a page the rotation cannot reach, which is the same defect as the
       private :root this replaced, one indirection deeper.
       ============================================================ */
    :root {
      --page-field: var(--pb-field, var(--bg-0));
      --page-grid-coarse: var(--pb-grid-coarse, transparent);
      --page-scanline: var(--pb-scanline, transparent);
      --page-bloom: var(--pb-bloom-cyan, none);
    }
    .pb-scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 60;
      background: repeating-linear-gradient(0deg, var(--page-scanline) 0 1px, transparent 1px 3px);
    }

    body {
      background:
        radial-gradient(60% 50% at 30% 20%, rgba(23,212,250,.16) 0%, transparent 60%),
        radial-gradient(45% 45% at 78% 70%, rgba(242,47,137,.13) 0%, transparent 60%),
        linear-gradient(90deg, var(--page-grid-coarse) 1px, transparent 1px),
        linear-gradient(0deg,  var(--page-grid-coarse) 1px, transparent 1px),
        var(--page-field);
      background-size: auto, auto, 120px 120px, 120px 120px;
    }
    h1 { text-shadow: var(--page-bloom); }
  </style>
</head>
<body>
  <div class="pb-scanlines" aria-hidden="true"></div>
  <main id="main">
    <div class="eyebrow">626 Labs · page not found</div>
    <p class="code">404</p>
    <h1>This page imagined something else.</h1>
    <p>The URL doesn't map to anything here — it may have moved, or never shipped. Let's get you back to solid ground.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to 626 Labs</a>
      <a class="btn btn-ghost" href="/plugins/">Browse the plugins</a>
    </div>
  </main>
</body>
</html>
