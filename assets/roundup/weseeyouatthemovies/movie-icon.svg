<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="filmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Film reel outer circle -->
  <circle cx="16" cy="16" r="14" fill="url(#filmGradient)" stroke="#333" stroke-width="1"/>
  <!-- Inner circle -->
  <circle cx="16" cy="16" r="6" fill="#333" stroke="#FFD700" stroke-width="1"/>
  <!-- Film holes (4 around the edge) -->
  <circle cx="16" cy="6" r="2" fill="#333"/>
  <circle cx="26" cy="16" r="2" fill="#333"/>
  <circle cx="16" cy="26" r="2" fill="#333"/>
  <circle cx="6" cy="16" r="2" fill="#333"/>
  <!-- Spokes -->
  <rect x="15" y="6" width="2" height="10" fill="#FFD700" opacity="0.7"/>
  <rect x="15" y="16" width="2" height="10" fill="#FFD700" opacity="0.7"/>
  <rect x="6" y="15" width="10" height="2" fill="#FFD700" opacity="0.7"/>
  <rect x="16" y="15" width="10" height="2" fill="#FFD700" opacity="0.7"/>
</svg>
