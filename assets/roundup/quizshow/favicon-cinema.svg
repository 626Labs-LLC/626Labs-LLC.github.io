<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)"/>
  <!-- Film reel base -->
  <circle cx="256" cy="256" r="180" fill="#0f172a" stroke="#1e293b" stroke-width="8"/>
  <!-- Center hole -->
  <circle cx="256" cy="256" r="40" fill="#f59e0b"/>
  <circle cx="256" cy="256" r="25" fill="#0f172a"/>
  <!-- Film perforations around the reel -->
  <g fill="#1e293b">
    <circle cx="256" cy="120" r="25"/>
    <circle cx="256" cy="392" r="25"/>
    <circle cx="120" cy="256" r="25"/>
    <circle cx="392" cy="256" r="25"/>
    <circle cx="160" cy="160" r="25"/>
    <circle cx="352" cy="352" r="25"/>
    <circle cx="352" cy="160" r="25"/>
    <circle cx="160" cy="352" r="25"/>
  </g>
  <!-- Question mark overlay -->
  <text x="256" y="290" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#f59e0b" text-anchor="middle">?</text>
</svg>
