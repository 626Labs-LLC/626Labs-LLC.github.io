name: Refresh RoRoRo Plugins

on:
  schedule:
    # 06:45 UTC daily — staggered inside the 06:00-07:00 job cluster.
    - cron: '45 6 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-rororo-plugins
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Don't re-trigger on our own bot commit. Same guard as the other push jobs.
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh marketplace data from the app catalog + plugin releases
        env:
          # All reads are public — the default token is only for rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-rororo-plugins.mjs

      - name: Commit + push if changed
        run: |
          if [[ -z "$(git status --porcelain data/rororo-plugins.json)" ]]; then
            echo "No marketplace drift."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rororo-plugins.json
          git commit -m "chore(rororo-marketplace): refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto remote main and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
