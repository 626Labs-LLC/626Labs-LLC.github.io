name: Rotate theme

# Monthly, unattended theme rotation for 626labs.dev. The safety property this
# workflow exists for: the site can only ever move from one verified state to
# another. Nothing is committed or pushed unless every gate passes. An empty
# queue is a clean no-op plus an issue, never a silent skip.
#
# Order: freeze the OUTGOING theme (still live at this point) -> rotate the
# registry (queue[0] becomes active) -> render the new active theme -> gate
# it -> commit + push, or (dry_run) stage + diff + stop.

on:
  schedule:
    - cron: '0 9 1 * *'   # 09:00 UTC on the 1st of every month
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate without committing or pushing'
        type: boolean
        default: false

concurrency:
  group: rotate-theme
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt pytest

      - name: Compute rotation month
        id: month
        run: |
          set -euo pipefail
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "month_name=$(date -u +'%B %Y')" >> "$GITHUB_OUTPUT"
          # archive_month is the month being ARCHIVED — the one that just
          # ENDED, not the one rotation is moving the site into. Rotation
          # always runs on the 1st (09:00 UTC), so "yesterday" is always the
          # last day of that ended month. This is the value the freeze dir,
          # the archive[] entry's URL, and the archive banner must all share
          # — do not use `month` (above) for any of those three.
          echo "archive_month=$(date -u -d yesterday +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Read the registry
        id: queue
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          reg = json.loads(open("content/themes.json", encoding="utf-8").read())
          print("empty=true" if not reg.get("queue") else "empty=false")
          # The theme that's still active RIGHT NOW, before rotation touches
          # the registry — capture_theme_screenshot(outgoing, ...) below
          # needs this slug explicitly; reading it fresh here (rather than
          # relying on registry state after the rotate step) means capture
          # order never depends on rotation order.
          print(f"outgoing={reg.get('active', '')}")
          PY

      - name: 'Dry run: report empty queue (no issue filed)'
        if: steps.queue.outputs.empty == 'true' && inputs.dry_run == true
        run: |
          set -euo pipefail
          echo "Queue is empty as of $(date -u +%F). A real run would file a"
          echo "\"Theme queue is empty\" issue here and stop; dry run just logs it."

      - name: Open issue — queue is empty
        if: steps.queue.outputs.empty == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "Theme queue is empty" \
            --body "Rotation ran on $(date -u +%F) with nothing queued. The site is unchanged."

      # ── everything below only runs when there's a theme queued ──────────

      - name: Install Playwright
        if: steps.queue.outputs.empty == 'false'
        # Moved ahead of freeze/capture (was previously installed just
        # before the theme-doctor gate): both screenshot-capture steps below
        # need a real browser now too, not just the browser gate.
        run: |
          set -euo pipefail
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Freeze the outgoing theme
        if: steps.queue.outputs.empty == 'false'
        run: python scripts/freeze-theme.py "${{ steps.month.outputs.archive_month }}"

      - name: Capture the retiring theme's screenshot
        if: steps.queue.outputs.empty == 'false'
        run: >
          python scripts/freeze-theme.py --screenshot
          "${{ steps.queue.outputs.outgoing }}"
          "assets/themes/${{ steps.queue.outputs.outgoing }}.png"

      - name: Rotate the registry
        if: steps.queue.outputs.empty == 'false'
        id: rotate
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          sys.path.insert(0, "scripts")
          import theme_registry as tr

          reg = tr.load()
          new_reg = tr.rotate(reg, "${{ steps.month.outputs.archive_month }}")
          with open("content/themes.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(new_reg, f, indent=2)
              f.write("\n")
          print(f"new_active={new_reg['active']}")
          PY

      - name: Render the new active theme
        if: steps.queue.outputs.empty == 'false'
        # render-plugin-pages.py joins render-hub.py here — the 15 per-plugin
        # pages inline their CSS from the ACTIVE theme's archetypes/
        # product.css (scripts/render-plugin-pages.py, wired in A5); without
        # this, a rotation promotes a new theme but leaves those 15 pages
        # dressed in whatever theme was active the last time this ran.
        run: |
          set -euo pipefail
          python scripts/render-hub.py
          python scripts/render-plugin-pages.py

      - name: Capture the incoming theme's screenshot
        if: steps.queue.outputs.empty == 'false'
        run: >
          python scripts/freeze-theme.py --screenshot
          "${{ steps.rotate.outputs.new_active }}"
          "assets/themes/${{ steps.rotate.outputs.new_active }}.png"

      - name: 'Gate: theme doctor (new active theme, browser checks)'
        if: steps.queue.outputs.empty == 'false'
        # --require-browser: this is the only unattended run of this gate, so
        # the horizontal-scroll/console-error checks failing to run at all
        # (playwright missing, chromium failing to launch) must fail the gate,
        # never silently skip it — a skip here would rubber-stamp every
        # monthly rotation with dead code, undetected.
        run: python scripts/theme-doctor.py "${{ steps.rotate.outputs.new_active }}" --browser --require-browser

      - name: 'Gate: render drift'
        if: steps.queue.outputs.empty == 'false'
        run: python scripts/render-hub.py --check

      - name: 'Gate: plugin pages render drift'
        if: steps.queue.outputs.empty == 'false'
        run: python scripts/render-plugin-pages.py --check

      - name: 'Gate: unit tests'
        if: steps.queue.outputs.empty == 'false'
        run: python -m pytest tests/ -q

      - name: 'Gate: site doctor'
        if: steps.queue.outputs.empty == 'false'
        run: python scripts/site-doctor.py --check

      - name: 'Dry run: stage + show diff, commit nothing'
        if: steps.queue.outputs.empty == 'false' && inputs.dry_run == true
        run: |
          set -euo pipefail
          git add -A
          echo "── staged diff (nothing will be committed) ──"
          git diff --stat --cached
          echo "── full status ──"
          git status --short
          echo "dry run: all gates passed, no commit made."

      - name: Commit + push rotation
        if: steps.queue.outputs.empty == 'false' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # press.html/privacy.html/thesis.html/workflow.html (theme-css
          # link) and about.html (the easter-egg theme registry) are ALSO
          # rewritten by render-hub.py on every rotation (their active-theme-
          # derived zones — see THEME_CSS_HREFS/render_about_theme_dresses)
          # but were missing from this list before A8 — found while auditing
          # what a rotation actually writes vs. what got committed; without
          # them, a live rotation would silently update those pages on the
          # runner's disk and never persist it, so they'd stay dressed in
          # whatever theme was active the last time someone hand-committed
          # them.
          # vibe-* / thesis-engine / plugins are the 15 render-plugin-
          # pages.py outputs (14 per-plugin pages + the family index); the
          # glob keeps this self-maintaining as plugins are added.
          git add content/themes.json index.html feed.xml sitemap.xml \
            conundrum.html themes.html press.html privacy.html about.html             thesis.html workflow.html \
            editorial themes/archive assets/themes \
            vibe-* thesis-engine plugins
          git commit -m "chore(themes): rotate to ${{ steps.rotate.outputs.new_active }} for ${{ steps.month.outputs.month_name }}

          Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>"
          # Retry push — another bot job (rebuild-hub, build-widget,
          # track-traffic, ...) may have pushed to main while we were
          # rendering and gating.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto remote main and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      - name: Open issue — rotation failed
        # Not dry_run-gated on the individual gate steps above (dry runs
        # skip commit/push, not the gates), so a dry run that trips a real
        # guard — e.g. freeze-theme.py's write-once archive check — must
        # NOT file a "rotation failed" issue against a run nobody asked to
        # actually ship. Only a real (non-dry) run gets to open one.
        if: failure() && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "Theme rotation failed on $(date -u +%F)" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          A gate failed (or the push itself failed) before every check cleared. The commit-and-push step only runs after every gate passes, so nothing was pushed to main — the site remains at its last verified state."
