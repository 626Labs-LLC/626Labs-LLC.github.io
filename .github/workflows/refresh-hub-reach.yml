name: Refresh Hub Reach

on:
  schedule:
    # Sundays 08:30 UTC.
    - cron: '30 8 * * 0'
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Stop checking actors after this many minutes'
        required: false
        default: '330'

concurrency:
  group: refresh-hub-reach
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Don't re-trigger when our own bot commits. Same pattern as
    # refresh-bacon-shards.yml.
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check actors against the hub's rules
        env:
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          MAX_MINUTES: ${{ inputs.max_minutes || '330' }}
        run: node scripts/refresh-hub-reach.mjs --max-minutes "$MAX_MINUTES"

      - name: Commit + push if changed
        # Runs after a failed check step too, so a partial cache on disk is kept.
        if: ${{ !cancelled() }}
        run: |
          if [[ -z "$(git status --porcelain apps/widget-bacon-trail/data/hub-reach.json)" ]]; then
            echo "No data drift."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/widget-bacon-trail/data/hub-reach.json
          git commit -m "chore(bacon-reach): refresh $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto remote main and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
