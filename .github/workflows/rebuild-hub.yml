name: Rebuild hub

on:
  push:
    branches: [main]
    paths:
      - 'content/site.json'
      - 'content/facts-supplement.json'
      - 'content/stories/**'
      - 'content/themes.json'
      - 'themes/**'
      - 'scripts/render-hub.py'
      - 'scripts/build-og-cards.py'
      # build-og-cards.py draws its field from the active theme's `raster`
      # block through this module, so a change to it is a change to every
      # card, the same as a change to the script itself.
      - 'scripts/raster_theme.py'
      # render-plugin-pages.py runs in this workflow too (see the step
      # below), so ITS inputs belong here or an edit to either one renders
      # nowhere until the next daily refresh-plugin-versions.yml cron.
      - 'scripts/render-plugin-pages.py'
      - 'content/plugin-pages.json'
      - 'scripts/site_facts.py'
      - 'requirements.txt'
      - '.github/workflows/rebuild-hub.yml'
  workflow_dispatch:

concurrency:
  group: rebuild-hub
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # Don't re-trigger when our own bot-authored commit lands.
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full token + same branch so we can push the rebuilt index.html back
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `pytest` is not in requirements.txt (it's test-only, never imported by
      # the renderer), so the "Gate: tests" step below needs it named here —
      # the same `-r requirements.txt pytest` the other three pytest-running
      # workflows install. It was missing from 3fce707, which is the commit
      # that ADDED that gate: every run since died on "No module named pytest"
      # before rendering anything, so this workflow silently stopped
      # re-rendering index.html on site.json pushes for eight days.
      - name: Install deps
        run: pip install -r requirements.txt pytest

      # Generate the per-story social cards FIRST so render-hub can point each
      # story page's og:image at a card that exists this run.
      - name: Build Field Note social cards (assets/og)
        run: python3 scripts/build-og-cards.py

      - name: Render hub from content (index, feed, sitemap, Field Note pages)
        run: python3 scripts/render-hub.py

      # The 15 generated product pages INLINE the active theme's
      # archetypes/product.css + product-tokens.css, so a themes/** edit
      # reaches them only when this runs. 'themes/**' was already a trigger
      # above, but this step was missing, so a hand-edit to a product
      # stylesheet landed on the two pages that LINK it instantly and on
      # these 15 not until refresh-plugin-versions.yml's next 07:00 cron —
      # a sub-24h window where two halves of one archetype rendered
      # different dresses. The split doubled the number of files with that
      # property, so the step is here now rather than the window being
      # documented.
      - name: Render plugin pages from the active theme's product dress
        run: python3 scripts/render-plugin-pages.py

      # The 15 generated page paths, from the only thing that knows them.
      # Replaces the `vibe-* thesis-engine plugins` glob in both lists
      # below, which was wrong twice over: it only self-maintains for ids
      # starting `vibe-` (thesis-engine was already the counterexample, and
      # the next non-`vibe-` id would render on the runner and never be
      # committed), and a glob matching nothing reaches git as a literal
      # pathspec, which errors, which makes `[ -n "$(…)" ]` false — the
      # workflow would report "no changes" rather than failing.
      # ── Gates, before anything is committed ──────────────────────────
      # This job commits ~23 files to main on any push touching site.json,
      # stories, or themes/** — and until now it ran ZERO gates, while
      # rotate-theme.yml (which commits a comparable set) runs four. That
      # asymmetry was invisible while this workflow only touched index.html;
      # the theme-css conversions grew its blast radius to every
      # hand-authored page on the site.
      #
      # pytest and site-doctor, not the full rotation stack: theme-doctor
      # grades a THEME, and this workflow does not change which theme is
      # active. render-hub/render-plugin-pages --check would be circular
      # here — this job just ran both renderers, so of course they are
      # up to date.
      - name: 'Gate: tests'
        run: python3 -m pytest tests/ -q

      - name: 'Gate: site doctor'
        run: python3 scripts/site-doctor.py --check

      - name: Check for changes
        id: changes
        # The hand-authored pages render-hub.py rewrites on every run —
        # the theme-css <link> pages plus about.html's easter-egg theme
        # registry — come from `render-hub.py
        # --list-renderer-owned-pages`, not from a list repeated here. They
        # were hand-enumerated in three places across two workflows with
        # nothing comparing them to THEME_CSS_HREFS; a tenth page joining
        # that map would render on the runner, pass --check because it WAS
        # rendered, and be left out of the commit — nine pages on the new
        # theme and one on the old. A8 already found exactly that for
        # press/privacy/about, after a rotation had run. The generated
        # plugin pages come from render-plugin-pages.py --list-outputs for
        # the same reason (see the note above the step).
        #
        # set -euo pipefail so a failing `git status` FAILS the run. Without
        # it the command substitution goes empty and the step cheerfully
        # reports "no changes" — the wrong failure direction for a step
        # whose whole job is noticing changes.
        run: |
          set -euo pipefail
          CHANGED="$(git status --porcelain -- \
            index.html feed.xml sitemap.xml editorial assets/og \
            $(python3 scripts/render-hub.py --list-renderer-owned-pages) \
            $(python3 scripts/render-plugin-pages.py --list-outputs))"
          if [ -n "$CHANGED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push rebuilt hub
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            index.html feed.xml sitemap.xml editorial assets/og \
            $(python3 scripts/render-hub.py --list-renderer-owned-pages) \
            $(python3 scripts/render-plugin-pages.py --list-outputs)
          git commit -m "hub: rebuild from site.json + stories

          Triggered by commit ${{ github.sha }}"
          # Retry push — another bot job (build-widget, refresh-bacon-shards,
          # track-traffic) may have pushed first while we were rendering.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto remote main and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ Hub rebuilt + pushed (index, feed, sitemap, theme gallery, Field Note pages, social cards) — GitHub Pages will redeploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Hub already matched content — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
