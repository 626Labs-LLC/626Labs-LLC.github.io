name: Rebuild hub

on:
  push:
    branches: [main]
    paths:
      - 'content/site.json'
      - 'content/facts-supplement.json'
      - 'content/stories/**'
      - 'scripts/render-hub.py'
      - 'scripts/build-og-cards.py'
      - 'scripts/site_facts.py'
      - 'requirements.txt'
      - '.github/workflows/rebuild-hub.yml'
  workflow_dispatch:

concurrency:
  group: rebuild-hub
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # Don't re-trigger when our own bot-authored commit lands.
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full token + same branch so we can push the rebuilt index.html back
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      # Generate the per-story social cards FIRST so render-hub can point each
      # story page's og:image at a card that exists this run.
      - name: Build Field Note social cards (assets/og)
        run: python3 scripts/build-og-cards.py

      - name: Render hub from content (index, feed, sitemap, Field Note pages)
        run: python3 scripts/render-hub.py

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain index.html feed.xml sitemap.xml editorial assets/og)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push rebuilt hub
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html feed.xml sitemap.xml editorial assets/og
          git commit -m "hub: rebuild from site.json + stories

          Triggered by commit ${{ github.sha }}"
          # Retry push — another bot job (build-widget, refresh-bacon-shards,
          # track-traffic) may have pushed first while we were rendering.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing onto remote main and retrying..."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ Hub rebuilt + pushed (index, feed, sitemap, Field Note pages, social cards) — GitHub Pages will redeploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Hub already matched content — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi
